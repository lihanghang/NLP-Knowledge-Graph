site_name: NLP-Knowledge-Graph 论文库
site_description: 自然语言处理与知识图谱论文在线阅读
site_url: https://lihanghang.github.io/NLP-Knowledge-Graph/
repo_url: https://github.com/lihanghang/NLP-Knowledge-Graph
repo_name: NLP-Knowledge-Graph
# 每个md生成平铺的 .html，保证 iframe 相对PDF路径正确解析
use_directory_urls: false
theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: 切换到暗色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: 切换到亮色模式
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.highlight
  - content.code.copy
  - toc.follow
plugins:
- search
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- tables
- admonition
- toc:
    permalink: true
extra_css:
- assets/pdf-viewer.css
